<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar wallpaper · Parede</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <header class="faixa">
    <div class="faixa-conteudo">
      <a class="marca" href="../index.html">Parede</a>
      <nav class="menu" aria-label="Principal">
        <a href="../index.html" aria-current="page">Galeria</a>
        <a href="categorias.html">Categorias</a>
      </nav>
    </div>
  </header>

  <main id="conteudo" class="pagina">
    <div id="avisos" class="avisos" role="status"></div>
    <noscript><p class="sem-js">Ative o JavaScript do navegador para usar o sistema.</p></noscript>

    <section class="topo-pagina">
      <h1 id="titulo-pagina">Cadastrar wallpaper</h1>
    </section>

    <form id="formulario" class="formulario">
      <div class="formulario-previa">
        <img id="previa" alt="Prévia da imagem escolhida" hidden>
        <p id="previa-vazia" class="previa-vazia">A prévia da imagem aparece aqui.</p>
      </div>

      <div class="formulario-campos">
        <label class="campo">
          <span>Imagem</span>
          <input type="file" id="imagem" name="imagem" accept="image/png,image/jpeg,image/webp">
          <small id="dica-imagem">PNG, JPG ou WEBP, até 5 MB. A resolução é lida automaticamente.</small>
        </label>

        <label class="campo">
          <span>Título</span>
          <input type="text" name="titulo" maxlength="80" required>
        </label>

        <label class="campo">
          <span>Categoria</span>
          <select name="categoria_id" required>
            <option value="">Escolha uma categoria</option>
          </select>
          <small id="sem-categoria" hidden>Cadastre uma <a href="categoria-form.html">categoria</a> antes.</small>
        </label>

        <label class="campo">
          <span>Autor ou fonte</span>
          <input type="text" name="autor" maxlength="60">
        </label>

        <label class="campo">
          <span>Tags</span>
          <input type="text" name="tags" placeholder="azul, noite, celular">
          <small>Separe por vírgulas. Máximo de 8 tags.</small>
        </label>

        <label class="campo">
          <span>Descrição</span>
          <textarea name="descricao" rows="3" maxlength="300"></textarea>
        </label>

        <div class="acoes">
          <button id="salvar" class="botao" type="submit">Cadastrar wallpaper</button>
          <a id="cancelar" class="botao botao-suave" href="../index.html">Cancelar</a>
        </div>
      </div>
    </form>
  </main>

  <footer class="rodape">Projeto Integrado · DWS, POO e BD · Cadastro de papéis de parede</footer>
  <script src="../js/comum.js"></script>
  <script src="../js/wallpaper-form.js"></script>
</body>
</html>
